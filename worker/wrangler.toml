name = "schematicanalyzer-proxy"
main = "index.js"
compatibility_date = "2026-07-31"

# The origins allowed to call this proxy. Anything else gets a 403 rather than
# an opaque CORS failure.
#
# Worth being honest about what this is: it stops *other websites* from
# spending the pool through a visitor's browser, which is the attack a browser
# can actually mount. It stops nothing from curl, which sets any Origin it
# likes. The daily cap is the limit that holds against a script.
#
# Local entries are this app's own dev server (5190) and vite preview
# (4173). Both http and https, because `npm run dev:lan` serves TLS; and
# 127.0.0.1 alongside localhost, because the browser treats them as different
# origins. Never set this to "*".
[vars]
ALLOWED_ORIGIN = "https://bigmoney21682-hub.github.io,http://localhost:5190,http://127.0.0.1:5190,https://localhost:5190,http://localhost:4173,http://127.0.0.1:4173,https://localhost:4173"

DAILY_CAP = "40"

# Per-IP request counters. Without this binding there is no cap at all, which
# is fine for a private URL and not fine for a published one. The namespace
# title is per-account, hence the app-specific name; the binding the Worker
# reads is always RATE_LIMIT. Each app counts separately, so a viewer gets a
# full allowance in each rather than one pooled across all three.
#   npx wrangler kv namespace create SCHEMATIC_RATE_LIMIT
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "5ca31452fa594c7aa9d24241cc960ae5"

# The key pools are secrets, deliberately absent from this file: comma- or
# newline-separated lists. The Worker rotates across each pool, so one key
# running out of free quota does not take the shared link down.
#   npx wrangler secret put GEMINI_KEYS   # AIza...,AIza...
#   npx wrangler secret put GROQ_KEYS     # gsk_...,gsk_...   (optional)
#
# Without GROQ_KEYS the /groq routes return a 500 naming the missing secret and
# the vendor fallback simply stops at Gemini. Without GEMINI_KEYS nothing works.
#
# APP_TOKEN is optional. Set it and the app must send a matching passphrase;
# leave it unset and the origin allowlist plus DAILY_CAP are the only limits.
#   npx wrangler secret put APP_TOKEN
